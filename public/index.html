<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04121f" />
  <title>كأس العالم 2026 — مباشر</title>
  <meta name="description" content="منتخبات كأس العالم 2026 بعرض شبكي — المجموعات والأدوار الإقصائية مع نتائج مباشرة تتحدّث بعد كل مباراة." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="pitch-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-badge">🏆</span>
        <div class="brand-text">
          <h1>كأس العالم <span class="year">2026</span></h1>
          <p class="host">الولايات المتحدة · كندا · المكسيك</p>
        </div>
      </div>
      <div class="live-pill" id="livePill" hidden>
        <span class="dot"></span><span id="liveCount">مباشر</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats" aria-label="ملخص">
      <div class="stat"><b id="statTeams">—</b><span>منتخب</span></div>
      <div class="stat"><b id="statGroups">—</b><span>مجموعة</span></div>
      <div class="stat"><b id="statMatches">—</b><span>مباراة</span></div>
      <div class="stat updated"><b id="statUpdated">—</b><span>آخر تحديث</span></div>
    </section>

    <nav class="tabs" role="tablist" aria-label="أقسام">
      <button class="tab is-active" data-tab="groups" role="tab">المجموعات</button>
      <button class="tab" data-tab="bracket" role="tab">الأدوار الإقصائية</button>
    </nav>

    <div id="liveStrip" class="live-strip" hidden></div>

    <section id="view-groups" class="view" role="tabpanel"></section>
    <section id="view-bracket" class="view" role="tabpanel" hidden></section>

    <div id="empty" class="empty" hidden>
      <div class="empty-emoji">⚽</div>
      <p id="emptyMsg">جارٍ تحميل بيانات البطولة…</p>
      <button id="retry" class="retry" hidden>إعادة المحاولة</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>البيانات تتحدّث تلقائيًا بعد كل مباراة · المصدر: TheSportsDB</p>
      <p class="muted">worldcup.alkamali.uk</p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
