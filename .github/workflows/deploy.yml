name: Deploy to Cloudflare

# Deploys the Worker (site + live API + cron + custom domain) to Cloudflare.
# Runs on GitHub's network, which can reach api.cloudflare.com.
# Requires one repository secret: CLOUDFLARE_API_TOKEN
#   (Workers Scripts:Edit, Account Settings:Read, Zone:Read,
#    Workers Routes:Edit, DNS:Edit on the alkamali.uk zone)

on:
  push:
    branches:
      - main
      - claude/worldcup-teams-grid-j9esfq
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
